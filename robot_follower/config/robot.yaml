# Physical robot parameters
wheel_radius: 0.1          # metres
track_width: 0.5           # metres (wheel base)
encoder_ticks_per_rev: 360

max_linear_speed: 2.0      # m/s
max_angular_speed: 4.0     # rad/s

# Motor PID gains
motor_pid:
  kp: 8.0
  ki: 2.0
  kd: 0.1

# Sensor noise (simulation)
imu_noise_std: 0.02
gps_noise_std: 0.2
wheel_slip_std: 0.05
