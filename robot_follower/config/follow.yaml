# Follow behaviour parameters
desired_distance: 1.0      # metres — stop when this close to target

# Proportional gains
kp_dist: 1.0               # linear speed gain
kp_angle: 3.0              # angular speed gain

max_linear_cmd: 1.0        # m/s — headroom for angular differential

# BLE / phone link simulation
ble_latency_seconds: 0.4
ble_packet_drop_rate: 0.1

# Phone path (simulation)
path_radius: 4.0           # metres
path_speed: 0.3            # rad/s

# Target confidence thresholds
min_confidence: 0.5        # below this, ignore target
lost_timeout_seconds: 1.0  # declare target lost after this gap
