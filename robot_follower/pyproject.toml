[project]
name = "robot_follower"
version = "0.1.0"
description = "Person-following differential-drive robot"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib (>=3.10.8,<4.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "pyyaml (>=6.0,<7.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true
packages = [{include = "robot_follower", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"

